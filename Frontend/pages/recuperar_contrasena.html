<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña - VetSalud</title>

  <!-- Fuentes oficiales de Google: Montserrat, Open Sans, Jost y Raleway -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@600;700;800&family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;500;600;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Iconos de Material Symbols Outlined y Font Awesome -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Hojas de estilos -->
  <link rel="stylesheet" href="../css/recuperar_contrasena.css">
</head>
<body data-page="recuperar">

  <div class="recuperar-pagina">
    <!-- Navegación modular -->
    <div id="nav-container"></div>

    <div class="recuperar-contenedor">
      
      <!-- Esferas decorativas de fondo -->
      <div class="recuperar-esfera-decorativa-1"></div>
      <div class="recuperar-esfera-decorativa-2"></div>

      <!-- Tarjeta principal -->
      <div class="recuperar-tarjeta">
        
        <!-- Logotipo oficial de VetSalud -->
        <div class="recuperar-logo-contenedor">
          <a href="index.html">
            <img 
              src="../assets/logo.png" 
              alt="Logotipo de VetSalud Veterinaria" 
              class="recuperar-logo-imagen"
            >
          </a>
        </div>

        <!-- Encabezado con título y mensaje -->
        <div class="recuperar-encabezado">
          <h1 class="recuperar-titulo">
            ¿Olvidaste tu contraseña?
          </h1>
          <p class="recuperar-subtitulo">
            No te preocupes, dinos tu correo electrónico y te enviaremos instrucciones para restablecerla.
          </p>
        </div>

        <!-- Formulario -->
        <form class="formulario-recuperar" id="form-recuperar">
          
          <!-- Campo: Correo Electrónico -->
          <div class="campo-grupo">
            <label for="correoRecuperar" class="campo-etiqueta">
              Correo Electrónico
            </label>
            <div class="campo-envoltorio-input">
              <span class="material-symbols-outlined campo-icono-izquierdo">mail</span>
              <input 
                type="email" 
                id="correoRecuperar" 
                name="correo" 
                placeholder="ej. juan@correo.com" 
                required 
                class="campo-entrada" 
                autocomplete="email"
              >
            </div>
          </div>

          <!-- Botón de Enviar Instrucciones -->
          <button type="submit" class="recuperar-boton-enviar">
            <span>Enviar instrucciones</span>
            <span class="material-symbols-outlined recuperar-boton-icono">send</span>
          </button>
        </form>

        <!-- Pie: Enlace de regreso al login -->
        <div class="recuperar-pie">
          <a href="login.html" class="recuperar-enlace-volver">
            <span class="material-symbols-outlined recuperar-enlace-icono">arrow_back</span>
            <span>Volver al Inicio de Sesión</span>
          </a>
        </div>

      </div>

    </div>

  <div id="accessibility-container"></div>
    <!-- ==========================================
         FOOTER GLOBAL (cargado automáticamente)
    =========================================== -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="../js/component-loader.js"></script>
  <script src="../js/pages/recuperar_contrasena.js"></script>
</body>
</html>
