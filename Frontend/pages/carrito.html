<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrito | VetSalud</title>

    <!-- Iconos de Material Symbols Outlined -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />

    <!-- Hojas de estilos -->
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../components/nav/nav.css" />
    <link rel="stylesheet" href="../css/carrito.css" />
  </head>

  <body data-page="carrito">
    <!-- Navegación modular -->
    <div id="nav-container"></div>

    <!-- Contenido principal del carrito -->
    <main class="carrito-pagina">
      <!-- Encabezado de la página -->
      <section class="carrito-encabezado">
        <span class="eyebrow">Tu compra</span>
        <h1>Carrito de compras</h1>
        <p>Revisa tus productos antes de confirmar el pedido.</p>
      </section>

      <!-- Cuadrícula / Layout del carrito -->
      <div class="carrito-layout">
        <!-- Lista de productos agregados al carrito -->
        <section>
          <div id="carrito-items" class="carrito-items"></div>
        </section>

        <!-- Barra lateral con resumen del pedido -->
        <aside class="resumen-compra">
          <h2>Resumen</h2>
          <!-- Cantidad total de productos -->
          <div class="resumen-linea">
            <span>Productos</span>
            <strong id="resumen-cantidad">0</strong>
          </div>
          <!-- Importe total a pagar -->
          <div class="resumen-linea total">
            <span>Total</span>
            <strong id="resumen-total">$0</strong>
          </div>
          <!-- Botón para iniciar el proceso de pago -->
          <button id="boton-comprar" class="btn btn-primary" type="button">
            Continuar con la compra
          </button>
          <!-- Enlace para volver a la tienda -->
          <a class="boton-secundario" href="tienda.html">Seguir comprando</a>
          <!-- Mensaje de estado o alertas del carrito -->
          <p id="mensaje-carrito" class="mensaje-carrito" role="alert"></p>
        </aside>
      </div>
    </main>

    <!-- Modal para finalizar y confirmar compra -->
    <div id="modal-compra" class="modal-carrito" aria-hidden="true">
      <!-- Fondo oscuro del modal -->
      <div class="modal-carrito__fondo" data-cerrar-compra></div>

      <!-- Cuadro de diálogo del modal -->
      <div class="modal-carrito__dialog">
        <!-- Botón para cerrar el modal -->
        <button
          class="modal-cerrar"
          type="button"
          data-cerrar-compra
          aria-label="Cerrar"
        >
          <span class="material-symbols-outlined">close</span>
        </button>

        <!-- Encabezado del modal de compra -->
        <h2>Finalizar compra</h2>
        <p>Completa los datos de entrega.</p>

        <!-- Formulario de datos de envío y facturación -->
        <form id="form-compra" novalidate>
          <!-- Campo: Nombre completo -->
          <label>
            Nombre completo
            <input id="nombre-compra" required />
          </label>

          <!-- Campo: Correo electrónico -->
          <label>
            Correo electrónico
            <input id="correo-compra" type="email" required />
          </label>

          <!-- Campo: Teléfono de contacto -->
          <label>
            Teléfono
            <input id="telefono-compra" type="tel" required />
          </label>

          <!-- Campo: Ciudad -->
          <label>
            Ciudad
            <input id="ciudad-compra" required />
          </label>

          <!-- Campo: Dirección de entrega -->
          <label>
            Dirección de entrega
            <input id="direccion-compra" required />
          </label>

          <!-- Campo: Método de pago -->
          <label>
            Método de pago
            <select id="pago-compra" required>
              <option value="">Selecciona</option>
              <option>Pago contra entrega</option>
              <option>Transferencia bancaria</option>
              <option>Pago en tienda</option>
            </select>
          </label>

          <!-- Campo: Notas u observaciones adicionales -->
          <label>
            Notas
            <input id="notas-compra" placeholder="Opcional" />
          </label>

          <!-- Mensajes informativos o errores del formulario -->
          <div id="mensaje-compra" class="mensaje-carrito" role="alert"></div>

          <!-- Botón de confirmación de pedido -->
          <button class="btn btn-primary" type="submit">
            Confirmar pedido
          </button>
        </form>
      </div>
    </div>

    <!-- Contenedor modular de accesibilidad -->
    <div id="accessibility-container"></div>

    <!-- Footer global cargado automáticamente -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="../js/component-loader.js"></script>
    <script src="../js/pages/carrito.js"></script>
  </body>
</html>
