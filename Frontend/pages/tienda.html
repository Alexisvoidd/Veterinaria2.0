<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tienda de productos para mascotas VetSalud.">
    <title>Tienda | VetSalud</title>

    <!-- Iconos de Font Awesome y Material Symbols Outlined -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">

    <!-- Hojas de estilos base y de la tienda -->
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/tienda.css">
</head>

<body data-page="tienda">
    <!-- Navegación modular -->
    <div id="nav-container"></div>

    <!-- Contenido principal de la tienda -->
    <main class="page-shell">
        <!-- Sección Hero: Título y descripción -->
        <section class="page-hero">
            <div class="page-container">
                <span class="eyebrow">Tienda VetSalud</span>
                <h1>Todo para cuidar a quien amas.</h1>
                <p>
                    Encuentra productos para alimentación, higiene, accesorios y bienestar.
                    Consulta su disponibilidad y agrégalos al carrito.
                </p>
            </div>
        </section>

        <!-- Sección de productos y catálogo -->
        <section class="section">
            <div class="page-container">
                <!-- Barra de herramientas: Búsqueda, filtros y botón del carrito -->
                <div class="store-toolbar">
                    <div>
                        <h2>Productos</h2>
                        <p id="results-count">Cargando productos...</p>
                    </div>

                    <div class="store-tools">
                        <!-- Campo de búsqueda por texto -->
                        <label class="search-box">
                            <span class="material-symbols-outlined">search</span>
                            <input
                                id="product-search"
                                type="search"
                                placeholder="Buscar por nombre o descripción..."
                                aria-label="Buscar producto"
                            >
                        </label>

                        <!-- Filtro por categoría -->
                        <select id="category-filter" aria-label="Filtrar por categoría">
                            <option value="todos">Todas las categorías</option>
                            <option value="ALIMENTACION">Alimentación</option>
                            <option value="HIGIENE">Higiene</option>
                            <option value="ACCESORIOS">Accesorios</option>
                            <option value="BIENESTAR">Bienestar</option>
                        </select>

                        <!-- Filtro por ordenación -->
                        <select id="sort-filter" aria-label="Ordenar productos">
                            <option value="relevancia">Más relevantes</option>
                            <option value="precio-asc">Precio: menor a mayor</option>
                            <option value="precio-desc">Precio: mayor a menor</option>
                            <option value="nombre">Nombre A-Z</option>
                            <option value="stock">Mayor disponibilidad</option>
                        </select>

                        <!-- Interruptor de solo disponibles -->
                        <label class="availability-toggle">
                            <input id="availability-filter" type="checkbox">
                            <span>Solo disponibles</span>
                        </label>

                        <!-- Botón para abrir el carrito -->
                        <button id="open-cart" class="cart-button" type="button">
                            <span class="material-symbols-outlined">shopping_cart</span>
                            <span>Carrito</span>
                            <b id="cart-count">0</b>
                        </button>
                    </div>
                </div>

                <!-- Chips de categorías rápidas -->
                <div id="category-chips" class="category-chips">
                    <button class="chip active" data-category="todos">Todos</button>
                    <button class="chip" data-category="ALIMENTACION">Alimentación</button>
                    <button class="chip" data-category="HIGIENE">Higiene</button>
                    <button class="chip" data-category="ACCESORIOS">Accesorios</button>
                    <button class="chip" data-category="BIENESTAR">Bienestar</button>
                </div>

                <!-- Cuadrícula dinámica de productos -->
                <div id="product-grid" class="product-grid"></div>
            </div>
        </section>
    </main>

    <!-- Modal de detalle de producto -->
    <div id="product-modal" class="modal" aria-hidden="true">
        <!-- Fondo oscuro del modal -->
        <div class="modal__backdrop" data-close-modal></div>

        <!-- Diálogo del modal -->
        <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <button class="modal__close" type="button" data-close-modal aria-label="Cerrar">
                <span class="material-symbols-outlined">close</span>
            </button>
            <!-- Contenido dinámico del producto inyectado por JS -->
            <div id="modal-content"></div>
        </div>
    </div>

    <!-- Contenedor modular de accesibilidad -->
    <div id="accessibility-container"></div>

    <!-- Footer global cargado automáticamente -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="../js/component-loader.js"></script>
    <script src="../js/pages/tienda.js"></script>
</body>
</html>
